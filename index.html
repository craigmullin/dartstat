<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DartStat personal darts practice tracking." />
    <meta name="theme-color" content="#f72585" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DartStat" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>DartStat</title>
  </head>
  <body>
    <div id="root">
      <main id="startup-message" style="box-sizing:border-box;min-height:100vh;padding:3rem 1.5rem;display:flex;align-items:center;justify-content:center;background:#fff8fc;color:#241924;font:600 18px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center">
        Loading DartStat…
      </main>
    </div>
    <script>
      (function () {
        var failed = false;
        function showFailure(detail) {
          if (failed) return;
          var message = document.getElementById("startup-message");
          if (!message) return;
          failed = true;
          while (message.firstChild) message.removeChild(message.firstChild);
          var heading = document.createElement("div");
          heading.textContent = "DartStat could not start on this device.";
          message.appendChild(heading);
          if (detail) {
            var diagnostic = document.createElement("small");
            diagnostic.style.cssText = "display:block;max-width:36rem;margin-top:.75rem;color:#5a294f;font:400 13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;word-break:break-word";
            diagnostic.textContent = "Startup detail: " + String(detail).slice(0, 180);
            heading.appendChild(diagnostic);
          }
          var reload = document.createElement("button");
          reload.type = "button";
          reload.textContent = "Reload";
          reload.style.cssText = "min-height:44px;margin-top:1rem;padding:.65rem 1rem;border:0;border-radius:8px;background:#f72585;color:white;font:inherit";
          reload.onclick = function () { location.reload(); };
          heading.appendChild(reload);
        }
        window.addEventListener("error", function (event) { showFailure(event.message || "script error"); });
        window.addEventListener("unhandledrejection", function (event) { showFailure(event.reason && event.reason.message ? event.reason.message : "startup promise rejected"); });
        window.setTimeout(function () { showFailure("startup timed out after 45 seconds"); }, 45000);
      }());
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
